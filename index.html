<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Orbit — Space Quiz</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light dark;
      --page: #f4f5fb;
      --surface: #fff;
      --surface-soft: #f6f6fc;
      --ink: #1e1b38;
      --muted: #77758e;
      --line: #e8e7f0;
      --purple: #7658e8;
      --purple-dark: #6244d4;
      --purple-wash: #f0edff;
      --signal: #148451;
      --signal-wash: #e6f7ed;
      --grid-line: rgb(86 76 148 / 5%);
      --gold: #825f12;
      --gold-bg: #fff6d9;
      --gold-light: #fff2c8;
      --gold-edge: #c99724;
      --green: #15804a;
      --green-bg: #e8f8ef;
      --red: #c63c50;
      --red-bg: #fff0f1;
      --shadow: 0 18px 55px rgb(42 34 92 / 10%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #12111c;
        --surface: #1d1b2a;
        --surface-soft: #262436;
        --ink: #f4f2ff;
        --muted: #aaa7bf;
        --line: #363346;
        --purple: #a18aff;
        --purple-dark: #b5a4ff;
        --purple-wash: #30294b;
        --signal: #79e0a5;
        --signal-wash: #183c2b;
        --grid-line: rgb(188 173 255 / 5%);
        --gold: #f4d277;
        --gold-bg: #3b321e;
        --gold-light: #4a3d1e;
        --gold-edge: #94732e;
        --green: #7ce0a7;
        --green-bg: #173b2a;
        --red: #ff91a0;
        --red-bg: #46252e;
        --shadow: 0 18px 55px rgb(0 0 0 / 25%);
      }
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      isolation: isolate;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 8%, rgb(169 151 255 / 16%), transparent 32%),
        radial-gradient(ellipse at 90% 88%, rgb(255 188 213 / 13%), transparent 30%),
        var(--page);
      font-size: 15px;
      line-height: 1.55;
      transition: background-color .25s ease, color .25s ease;
    }

    body::before {
      position: fixed;
      z-index: 0;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 8% 18%, rgb(125 105 196 / 38%) 98%, transparent),
        radial-gradient(1.5px 1.5px at 22% 76%, rgb(125 105 196 / 32%) 98%, transparent),
        radial-gradient(1px 1px at 37% 38%, rgb(125 105 196 / 34%) 98%, transparent),
        radial-gradient(1.5px 1.5px at 53% 12%, rgb(125 105 196 / 30%) 98%, transparent),
        radial-gradient(1px 1px at 68% 83%, rgb(125 105 196 / 36%) 98%, transparent),
        radial-gradient(1.5px 1.5px at 82% 27%, rgb(125 105 196 / 31%) 98%, transparent),
        radial-gradient(1px 1px at 94% 61%, rgb(125 105 196 / 34%) 98%, transparent);
      content: "";
      animation: star-glimmer 8s ease-in-out infinite alternate;
    }

    button { font: inherit; }

    .app {
      width: min(100%, 530px);
      position: relative;
      z-index: 1;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-bottom: 16px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 1px solid rgb(255 255 255 / 38%);
      border-radius: 9px;
      color: #fff;
      background: linear-gradient(145deg, #8774d7, #54458f);
      box-shadow: 0 3px 10px rgb(70 59 123 / 22%);
      font-size: 17px;
      letter-spacing: 0;
    }

    .card {
      position: relative;
      padding: 30px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
        var(--surface);
      background-size: 24px 24px;
      box-shadow: var(--shadow), inset 0 0 0 5px var(--surface-soft);
      animation: arrive .45s cubic-bezier(.2,.8,.2,1) both;
    }

    .card::before {
      position: absolute;
      inset: 6px 6px auto;
      height: 3px;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--purple), transparent 72%);
      content: "";
    }

    .card > * { position: relative; z-index: 1; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(12px) scale(.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .telemetry {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 27px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .telemetry-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--signal);
      box-shadow: 0 0 0 3px var(--signal-wash);
    }

    .telemetry-divider {
      height: 12px;
      margin: 0 3px;
      border-left: 1px solid var(--line);
    }

    .telemetry-code {
      margin-left: auto;
      color: var(--purple-dark);
      font-variant-numeric: tabular-nums;
    }

    .score {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--purple-dark);
      background: var(--surface);
      font-weight: 750;
      letter-spacing: 0;
    }

    .progress-track {
      width: 100%;
      height: 7px;
      margin-bottom: 25px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: var(--surface-soft);
    }

    .progress-fill {
      width: 10%;
      height: 100%;
      border-radius: 2px;
      background: repeating-linear-gradient(90deg, var(--purple-dark) 0 9px, transparent 9px 12px);
      transition: width .45s cubic-bezier(.2,.8,.2,1);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--purple-dark);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    h1, h2, p { margin-top: 0; }
    h1, h2 {
      margin-bottom: 10px;
      font-size: clamp(23px, 5vw, 29px);
      line-height: 1.2;
      letter-spacing: -.04em;
    }

    .prompt { margin-bottom: 22px; color: var(--muted); }

    .answers {
      display: grid;
      gap: 10px;
    }

    .answer {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 54px;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--ink);
      text-align: left;
      background: var(--surface);
      cursor: pointer;
      transition: transform .16s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: var(--purple);
      box-shadow: 0 5px 16px rgb(118 88 232 / 10%);
    }

    .answer:focus-visible, .primary:focus-visible, .secondary:focus-visible {
      outline: 3px solid var(--purple-dark);
      outline-offset: 3px;
      box-shadow: 0 0 0 5px var(--surface), 0 0 0 8px rgb(118 88 232 / 24%);
    }

    .choice-key {
      display: grid;
      flex: 0 0 29px;
      height: 29px;
      margin-right: 12px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--muted);
      background: var(--surface-soft);
      font-size: 12px;
      font-weight: 750;
    }

    .answer:disabled { cursor: default; }
    .answer.correct {
      border-color: #62c98b;
      color: var(--green);
      background: var(--green-bg);
      animation: pop .35s ease both;
    }
    .answer.correct .choice-key { color: var(--green); background: rgb(21 128 74 / 12%); }
    .answer.wrong {
      border-color: #ed8491;
      color: var(--red);
      background: var(--red-bg);
      animation: shake .38s ease both;
    }
    .answer.wrong .choice-key { color: var(--red); background: rgb(198 60 80 / 11%); }
    .answer.show-correct { border-color: #62c98b; }

    @keyframes pop {
      50% { transform: scale(1.015); }
    }
    @keyframes shake {
      15%, 55%, 90% { transform: translateX(-5px); }
      35%, 75% { transform: translateX(5px); }
    }

    .feedback {
      min-height: 28px;
      margin: 15px 0 0;
      font-size: 13px;
      font-weight: 650;
    }
    .feedback.good { color: var(--green); }
    .feedback.bad { color: var(--red); }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 15px;
    }
    .primary, .secondary {
      min-height: 46px;
      padding: 0 20px;
      border: 1px solid transparent;
      border-radius: 9px;
      font-weight: 750;
      cursor: pointer;
      transition: transform .16s ease, filter .16s ease;
    }
    .primary {
      color: #fff;
      background: linear-gradient(135deg, #7660c8, #51428c);
      box-shadow: 0 4px 12px rgb(81 66 140 / 22%);
    }
    .primary:hover { transform: translateY(-1px); filter: brightness(1.06); }
    .primary:disabled { cursor: not-allowed; opacity: .48; box-shadow: none; }
    .secondary {
      color: var(--purple-dark);
      background: var(--purple-wash);
    }
    .secondary:hover { transform: translateY(-1px); }

    .result {
      padding: 16px 4px 6px;
      text-align: center;
    }
    .result-emoji {
      display: grid;
      width: 92px;
      height: 92px;
      margin: 0 auto 19px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--purple-wash);
      font-size: 50px;
      animation: float 2.5s ease-in-out infinite;
    }
    @keyframes float {
      50% { transform: translateY(-5px) rotate(2deg); }
    }
    @keyframes star-glimmer {
      from { opacity: .48; }
      to { opacity: .9; }
    }

    .high-score {
      border-color: var(--gold-edge);
      box-shadow: var(--shadow), inset 0 0 0 5px var(--surface-soft), 0 0 34px rgb(236 188 76 / 14%);
    }
    .high-score::before {
      height: 4px;
      background: linear-gradient(90deg, #d6a735, #8f78dd 52%, transparent);
    }
    .high-score .result-emoji {
      border-color: var(--gold-edge);
      background: linear-gradient(145deg, var(--purple-wash), var(--gold-light));
      box-shadow: 0 0 0 7px rgb(233 180 78 / 12%), 0 10px 28px rgb(201 151 36 / 20%);
      animation: victory-bounce .75s cubic-bezier(.2,.8,.2,1) 2;
    }
    .high-score .result-score {
      color: var(--gold);
      text-shadow: 0 3px 20px rgb(233 180 78 / 26%);
    }
    .high-score .rank-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 0 0 8px;
      padding: 6px 10px;
      border: 1px solid var(--gold-edge);
      border-radius: 99px;
      color: var(--gold);
      background: var(--gold-bg);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .high-score .rank-chip::before { content: "★"; }
    .celebration-bits {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .celebration-bits i {
      position: absolute;
      top: -10px;
      width: 7px;
      height: 12px;
      border-radius: 2px;
      background: var(--confetti-color);
      animation: confetti-fall 1.9s ease-in both;
    }
    .celebration-bits i:nth-child(1) { left: 8%; --confetti-color: #e7b743; animation-delay: .02s; }
    .celebration-bits i:nth-child(2) { left: 19%; --confetti-color: #8b73dd; animation-delay: .22s; }
    .celebration-bits i:nth-child(3) { left: 31%; --confetti-color: #ed8d9c; animation-delay: .1s; }
    .celebration-bits i:nth-child(4) { left: 72%; --confetti-color: #58b994; animation-delay: .3s; }
    .celebration-bits i:nth-child(5) { left: 84%; --confetti-color: #e7b743; animation-delay: .16s; }
    .celebration-bits i:nth-child(6) { left: 94%; --confetti-color: #8b73dd; animation-delay: .38s; }
    @keyframes victory-bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      45% { transform: translateY(-9px) scale(1.06); }
    }
    @keyframes confetti-fall {
      0% { opacity: 0; transform: translateY(-5px) rotate(0); }
      15% { opacity: 1; }
      100% { opacity: 0; transform: translateY(250px) rotate(420deg); }
    }

    .result-score {
      margin: 18px 0 8px;
      color: var(--purple-dark);
      font-size: 43px;
      font-weight: 850;
      line-height: 1;
      letter-spacing: -.06em;
    }
    .result-copy { max-width: 340px; margin: 0 auto 24px; color: var(--muted); }
    .result .primary { min-width: 155px; }

    .footer {
      margin: 15px 0 0;
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .13em;
      text-align: center;
      text-transform: uppercase;
    }

    .footer::before {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin: 0 8px 1px 0;
      border-radius: 50%;
      background: var(--signal);
      content: "";
    }

    @media (max-width: 480px) {
      body { padding: 24px 14px; }
      .card { padding: 25px 19px; border-radius: 16px; }
      .progress-track { margin-bottom: 23px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      body::before { animation: none; }
      .celebration-bits i { animation: none; opacity: .5; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span> Orbit Mission Control</div>
    <section class="card" id="quiz" aria-live="polite"></section>
    <p class="footer">Systems nominal · Ready for launch</p>
  </main>

  <script>
    const questions = [
      {
        question: "Which planet is known as the Red Planet?",
        answers: ["Venus", "Mars", "Jupiter", "Mercury"],
        correct: 1,
        fact: "Mars looks red because iron minerals in its soil have rusted."
      },
      {
        question: "What is the closest star to Earth?",
        answers: ["Sirius", "Proxima Centauri", "The Sun", "Polaris"],
        correct: 2,
        fact: "Our Sun is an ordinary star—and it's about 150 million km away."
      },
      {
        question: "Which planet has the most prominent ring system?",
        answers: ["Neptune", "Saturn", "Uranus", "Jupiter"],
        correct: 1,
        fact: "Saturn's rings are made mostly of countless pieces of ice and rock."
      },
      {
        question: "What was the first human-made object to reach space?",
        answers: ["Sputnik 1", "Apollo 11", "V-2 rocket", "Explorer 1"],
        correct: 2,
        fact: "A German V-2 rocket crossed the Kármán line in 1944."
      },
      {
        question: "Which galaxy is home to our solar system?",
        answers: ["Andromeda", "Whirlpool Galaxy", "Sombrero Galaxy", "Milky Way"],
        correct: 3,
        fact: "Our solar system sits in the Milky Way's Orion Arm."
      },
      {
        question: "How long does sunlight take to reach Earth?",
        answers: ["About 8 minutes", "About 8 seconds", "About 1 hour", "About 1 day"],
        correct: 0,
        fact: "Sunlight travels 150 million km to Earth in roughly 8 minutes and 20 seconds."
      },
      {
        question: "Which planet is the largest in our solar system?",
        answers: ["Saturn", "Jupiter", "Neptune", "Earth"],
        correct: 1,
        fact: "Jupiter is so big that more than 1,300 Earths could fit inside it."
      },
      {
        question: "What do astronauts call the boundary where space begins?",
        answers: ["The Apollo Line", "The Hubble Limit", "The Kármán line", "The Kepler Belt"],
        correct: 2,
        fact: "The internationally recognized Kármán line is 100 km above sea level."
      },
      {
        question: "Which moon is the largest in the solar system?",
        answers: ["Titan", "Earth's Moon", "Europa", "Ganymede"],
        correct: 3,
        fact: "Jupiter's moon Ganymede is even larger than the planet Mercury."
      },
      {
        question: "What is the name of NASA's most famous space telescope?",
        answers: ["Hubble Space Telescope", "Kepler Space Telescope", "Voyager 1", "Juno"],
        correct: 0,
        fact: "The Hubble Space Telescope has helped us explore the universe since 1990."
      }
    ];

    const quiz = document.querySelector("#quiz");
    let current = 0;
    let score = 0;
    let answered = false;

    quiz.addEventListener("keydown", event => {
      if (event.key === "Enter" && answered && quiz.querySelector("#next")) {
        event.preventDefault();
        quiz.querySelector("#next").click();
        return;
      }
      if (!/^[1-4]$/.test(event.key) || answered || event.altKey || event.ctrlKey || event.metaKey) return;
      event.preventDefault();
      const choice = quiz.querySelectorAll(".answer")[Number(event.key) - 1];
      if (choice) choice.click();
    });

    function renderQuestion() {
      answered = false;
      quiz.classList.remove("high-score");
      const item = questions[current];
      const percent = ((current + 1) / questions.length) * 100;
      quiz.innerHTML = `
        <div class="telemetry" aria-label="Mission status: systems nominal">
          <span class="telemetry-dot" aria-hidden="true"></span>
          <span>Systems nominal</span>
          <span class="telemetry-divider" aria-hidden="true"></span>
          <span>Mission 01</span>
          <span class="telemetry-code">OR-${String(current + 1).padStart(2, "0")}</span>
        </div>
        <div class="topline">
          <span>Flight log · ${String(current + 1).padStart(2, "0")} / ${String(questions.length).padStart(2, "0")}</span>
          <span class="score" aria-label="Score: ${score}">⭐ <span>${score}</span></span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="${questions.length}" aria-valuenow="${current + 1}">
          <div class="progress-fill" style="width: ${percent}%"></div>
        </div>
        <p class="eyebrow">Navigation systems · Knowledge check</p>
        <h1 id="question-title" tabindex="-1">${item.question}</h1>
        <p class="prompt">Choose an answer to continue · press 1–4 on your keyboard</p>
        <div class="answers" role="group" aria-labelledby="question-title">
          ${item.answers.map((answer, index) => `
            <button class="answer" type="button" data-index="${index}">
              <span class="choice-key" aria-hidden="true">${String.fromCharCode(65 + index)}</span>
              <span>${answer}</span>
            </button>`).join("")}
        </div>
        <p class="feedback" id="feedback" aria-live="polite"></p>
        <div class="actions"><button class="primary" id="next" type="button" disabled>${current === questions.length - 1 ? "See results" : "Next question"} <span aria-hidden="true">→</span></button></div>
      `;

      quiz.querySelectorAll(".answer").forEach(button => {
        button.addEventListener("click", () => selectAnswer(Number(button.dataset.index)));
      });
      quiz.querySelector("#next").addEventListener("click", () => {
        if (current < questions.length - 1) {
          current++;
          renderQuestion();
          quiz.querySelector("#question-title").focus();
        } else {
          renderResults();
          quiz.querySelector(".result h1").focus();
        }
      });
    }

    function selectAnswer(selected) {
      if (answered) return;
      answered = true;
      const item = questions[current];
      const buttons = [...quiz.querySelectorAll(".answer")];
      const feedback = quiz.querySelector("#feedback");
      const isCorrect = selected === item.correct;

      buttons.forEach((button, index) => {
        button.disabled = true;
        if (index === item.correct) button.classList.add(isCorrect ? "correct" : "show-correct");
        if (index === selected && !isCorrect) button.classList.add("wrong");
      });

      if (isCorrect) {
        score++;
        feedback.textContent = `Brilliant! ${item.fact}`;
        feedback.className = "feedback good";
      } else {
        feedback.textContent = `Not quite! ${item.fact}`;
        feedback.className = "feedback bad";
      }
      quiz.querySelector(".score span").textContent = score;
      quiz.querySelector(".score").setAttribute("aria-label", `Score: ${score}`);
      quiz.querySelector("#next").disabled = false;
      quiz.querySelector("#next").focus();
    }

    function renderResults() {
      const ratio = score / questions.length;
      const highScore = score >= 8;
      quiz.classList.toggle("high-score", highScore);
      const result = ratio === 1
        ? { emoji: "🚀", title: "Out of this world!", copy: "A perfect mission. You really know your way around the cosmos." }
        : highScore
          ? { emoji: "🏅", title: "Mission ace!", copy: "Command-level performance. The cosmos is yours to explore!" }
        : ratio >= .7
          ? { emoji: "🌟", title: "Stellar work!", copy: "Your cosmic curiosity is taking you places. Keep exploring!" }
          : ratio >= .4
            ? { emoji: "🪐", title: "Nice orbit!", copy: "You’re on your way to the stars. There’s always more universe to discover." }
            : { emoji: "🌙", title: "Dream big, explorer!", copy: "Every space expert starts somewhere. Ready for another launch?" };

      quiz.innerHTML = `
        <div class="result">
          ${highScore ? '<div class="celebration-bits" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>' : ""}
          <div class="result-emoji" aria-hidden="true">${result.emoji}</div>
          ${highScore ? '<p class="rank-chip">Mission rank · Ace</p>' : ""}
          <p class="eyebrow">Mission complete · Debrief</p>
          <h1 tabindex="-1">${result.title}</h1>
          <p class="result-score">${score}<span style="font-size:22px;color:var(--muted);font-weight:650"> / ${questions.length}</span></p>
          <p class="result-copy">${result.copy}</p>
          <button class="primary" id="restart" type="button">Play again <span aria-hidden="true">↻</span></button>
        </div>
      `;
      quiz.querySelector("#restart").addEventListener("click", () => {
        current = 0;
        score = 0;
        renderQuestion();
        quiz.querySelector("#question-title").focus();
      });
    }

    renderQuestion();
  </script>
</body>
</html>
